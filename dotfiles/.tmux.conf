set -g default-terminal "tmux-256color"
set -g xterm-keys on
set -g extended-keys on

set -g mouse on
set -g status on
set -g status-position top

setw -g mode-keys vi
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key v copy-mode

set -g history-limit 50000

# TPM
set -g @plugin 'tmux-plugins/tpm'
# ------ TPM -----

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W #{?pane_in_mode,[copy],#{pane_current_command}}"
set -g @catppuccin_window_current_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ------ END TPM -----
run '~/.tmux/plugins/tpm/tpm'

bind-key r source-file ~/.tmux.conf \; display "Reloaded"

bind -r C-h resize-pane -L 10
bind -r C-j resize-pane -D 10
bind -r C-k resize-pane -U 10
bind -r C-l resize-pane -R 10

bind -n M-a choose-tree
bind -n M-e choose-session
bind -n M-w choose-tree -w

bind-key u display-popup -d '#{pane_current_path}' -w 90% -h 90% -E
bind-key g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'lazygit'
bind-key v display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'gcode'
