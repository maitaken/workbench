set -g default-terminal "tmux-256color"
set -g xterm-keys on
set -g extended-keys on

set -g mouse on
set -g status on

setw -g mode-keys vi
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi v send -X begin-selection
bind-key v copy-mode

set -g history-limit 50000

# Design
set -g status-position bottom
set -g status-bg "colour238"
set -g status-fg "colour255"
set -g status-left-length 24
set -g status-left "#[fg=colour232,bg=colour45,bold] SESSION #[fg=colour255,bg=colour31] #S #[default] "
set -g window-status-format "#[fg=colour250,bg=colour238] #I:#W "
set -g window-status-current-format "#[fg=colour232,bg=colour220,bold] #I:#W "
set -g pane-border-style "fg=colour244"
set -g pane-active-border-style "fg=colour45"
set -g pane-border-lines simple

bind-key r source-file ~/.tmux.conf \; display "Reloaded"

bind -r C-h resize-pane -L 10
bind -r C-j resize-pane -D 10
bind -r C-k resize-pane -U 10
bind -r C-l resize-pane -R 10

bind -n M-a choose-tree
bind -n M-e choose-session
bind -n M-w choose-tree -w

bind-key u display-popup -d '#{pane_current_path}' -w 90% -h 90% -E
bind-key g display-popup -d '#{pane_current_path}' -w 90% -h 90% -E 'lazygit'
